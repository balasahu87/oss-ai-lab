name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e packages/ragline -e packages/llmboost -e packages/agenloop pytest
      - name: Test
        run: pytest -q
      - name: Offline demos
        run: |
          python demos/demo_ragline.py
          python demos/demo_agent_offline.py

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-enhance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
