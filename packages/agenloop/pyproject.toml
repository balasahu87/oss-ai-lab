[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenloop"
version = "0.1.0"
description = "Bounded plan-tool-observe-reflect agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Balaram Sahu" }]
dependencies = []
keywords = ["agents", "tool-use", "llm", "rag"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
