[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragline"
version = "0.1.0"
description = "Hybrid RAG toolkit: BM25 + dense vectors, RRF, citations, CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Balaram Sahu" }]
dependencies = []
keywords = ["rag", "retrieval", "bm25", "llm", "generative-ai"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ragline = "ragline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
